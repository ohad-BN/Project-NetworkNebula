server {
    listen 80;
    server_name localhost;
    client_max_body_size 256M;

    resolver 127.0.0.11 valid=5s ipv6=off;
    set $api_upstream "http://api:8000";
    set $minio_upstream "http://minio:9000";

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;
    gzip_disable "MSIE [1-6]\.";

    # Common proxy headers inherited by backend locations without custom proxy_set_header
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Reverse proxy for FastAPI backend REST & bootstrapper endpoints
    # Uses (/|$) boundary so React routes like /api-tokens, /worker, and /wallet stay on SPA
    location ~ ^/(api|auth|workers|tasks|distributed|grpc)(/|$) {
        proxy_pass $api_upstream;
    }

    location ~ ^/wallet/(balance|deposit|withdraw)(/|$) {
        proxy_pass $api_upstream;
    }

    location ~ ^/(health|pricing|metrics|docs|redoc|openapi\.json|connect\.ps1|connect\.sh|nebula_worker\.py)$ {
        proxy_pass $api_upstream;
    }

    # Reverse proxy for OpenAI-compatible gateway endpoints (/v1/chat/completions, /v1/models)
    location /v1/ {
        proxy_pass $api_upstream;
        proxy_buffering off;
        proxy_cache off;
    }

    # Reverse proxy for WebSockets (worker tunnels & cluster telemetry broadcasts)
    location /ws/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Reverse proxy for MinIO S3 object storage buckets (renders, datasets, checkpoints, models)
    # Preserves Host: minio:9000 so AWSv4 presigned PUT/GET signatures validate cleanly
    location ~ ^/(nebula-renders|nebula-datasets|nebula-checkpoints|nebula-models)(/|$) {
        client_max_body_size 100M;
        proxy_pass $minio_upstream;
        proxy_set_header Host minio:9000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Single Page Application routing (HTML5 history mode)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
